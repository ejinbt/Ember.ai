# Keeps this fork (deployed on Vercel) in step with alenjoby/Ember.ai: every 15 minutes it merges
# upstream main into this fork's main; Vercel deploys each new commit. Run it by hand from the
# Actions tab ("Run workflow") for an immediate sync.
name: Sync from upstream

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Merge upstream main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/merge-upstream" -f branch=main
